<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Acesso Restrito | Caso 074-L</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--bg-main:#0f1218;
--bg-panel:#1a1f27;
--text-main:#e6e6e6;
--text-muted:#9aa3ad;
--accent:#3a5a8c;
--error:#c85b5b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg-main);
color:var(--text-main);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.box{
background:var(--bg-panel);
border:1px solid #222;
padding:35px;
border-radius:6px;
width:340px;
text-align:center;
}

h1{
font-size:18px;
margin-bottom:10px;
}

.subtitle{
font-size:13px;
color:var(--text-muted);
margin-bottom:25px;
line-height:1.5;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:4px;
margin-bottom:15px;
background:#0b0e13;
color:white;
}

button{
background:var(--accent);
border:none;
padding:10px;
width:100%;
color:white;
border-radius:4px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.error{
color:var(--error);
font-size:12px;
margin-top:10px;
display:none;
}

.hint{
margin-top:20px;
font-size:12px;
color:#aaa;
font-style:italic;
}

a{
display:block;
margin-top:25px;
font-size:12px;
color:var(--text-muted);
text-decoration:none;
}

</style>
</head>

<body>

<div class="box">

<h1>Acesso Restrito</h1>

<p class="subtitle">
Material operacional não autorizado<br>
Caso 074-L
</p>

<input type="password" id="senha" placeholder="Senha">

<button onclick="verificar()">Acessar</button>

<div class="error" id="erro">
Senha incorreta
</div>

<div class="hint">
“filha”
</div>

<a href="arquivos-aleksei.html">← Voltar</a>

</div>

<script>

function verificar(){

let senha = document.getElementById("senha").value;

if(senha === "Miya"){
window.location.href = "alek-lotus.html";
}else{
document.getElementById("erro").style.display = "block";
}

}

</script>

</body>
</html>
